name: streambox
description: Streambox - stream movies and series, save them for later and download inside the app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.5.0
  wakelock_plus: ^1.2.10
  http: ^1.5.0
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  flutter_downloader: ^1.11.8
  permission_handler: ^11.3.1
  share_plus: ^10.1.4
  android_intent_plus: ^5.2.0
  open_filex: ^4.7.0
  google_sign_in: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/splash/splash.png

# Native launch screen (generated by `dart run flutter_native_splash:create`,
# the GitHub workflow does it after `flutter create`).
flutter_native_splash:
  color: "#09060F"
  image: assets/splash/splash.png
  android: true
  ios: false
  web: false
  android_gravity: center
  android_12:
    color: "#09060F"
    image: assets/splash/splash_android12.png

# App (launcher) icon: the same Streambox logo as the splash screen.
# Generated by `dart run flutter_launcher_icons` (the GitHub workflow does it
# after `flutter create`).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#09060F"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
