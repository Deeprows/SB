name: Create release keystore (run once)

# Run this ONCE from the Actions tab (Run workflow) if you have no keystore.
# It makes a signing key and a text file with the 4 values to paste into
# Settings -> Secrets and variables -> Actions. USE A PRIVATE REPOSITORY:
# anyone who can download this run's artifact can sign apps as you.
# Delete the artifact (and this run) as soon as you have copied the values.

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate keystore
        run: |
          PASS=$(openssl rand -hex 12)
          keytool -genkeypair -v \
            -keystore upload-keystore.jks -storetype PKCS12 \
            -alias streambox -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Streambox, O=Deeprows, C=EG"
          {
            echo "Add these 4 repository secrets (Settings > Secrets and variables > Actions):"
            echo
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_PASSWORD=$PASS"
            echo "KEY_ALIAS=streambox"
            echo
            echo "KEYSTORE_BASE64 (one long line):"
            base64 -w0 upload-keystore.jks
            echo
            echo
            echo "SHA-1 for the Google Cloud Android OAuth client (see AUTH.md):"
            keytool -list -v -keystore upload-keystore.jks -storepass "$PASS" | grep "SHA1:"
          } > keystore-secrets.txt

      - name: Upload (1 day only)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-secrets
          path: keystore-secrets.txt
          retention-days: 1
